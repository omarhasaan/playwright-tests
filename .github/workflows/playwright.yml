on:
  workflow_dispatch:
    inputs:
      run-testcases:
        description: 'Test command to run'
        default: 'npm run run-testcases'
      workers:
        description: 'Number of workers'
        default: '1'
      browsers:
        description: 'Browsers to test'
        default: 'chromium'

jobs:
  playwright-tests:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: lts/*

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright Browsers
        run: npx playwright install --with-deps

      - name: Run Playwright tests
        env:
          run-testcases: ${{ inputs.run-testcases || 'npm run run-testcases' }}
          workers: ${{ inputs.workers || '1' }}
          browsers: ${{ inputs.browsers || 'chromium' }}
        run: |
          ${{ env.run-testcases }} --worker=${{ env.workers }} --browser=${{ env.browsers }}


  snyk:
    needs: playwright-tests
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: lts/*

      - name: Install dependencies
        run: npm ci

      - name: Run Snyk
        uses: snyk/actions/node@master
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}


  zap:
    needs: playwright-tests
    runs-on: ubuntu-latest

    steps:
      - name: ZAP Scan
        uses: zaproxy/action-full-scan@v0.13.0
        with:
          target: 'https://the-internet.herokuapp.com/upload'


  report:
    needs: playwright-tests
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 30