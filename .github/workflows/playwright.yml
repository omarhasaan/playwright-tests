name: Playwright Tests
on:
  push:
    branches: [master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:
    inputs:
      run-testcases:
        description: 'add your npx code'
        required: false
        default: "npm run run-testcases"
        type: string
      workers:
        description: 'number of workers'
        required: false
        default: "4"
        type: choice
        options:
          - '1'
          - '2'
          - '3'
          - '4'
      browsers:
        description: 'type of browser'
        required: false
        default: "chromium"
        type: choice
        options:
          - 'firefox'
          - 'chromium'
          - 'webkit'
          - 'all'
jobs:
  test:
    timeout-minutes: 60
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-node@v4
      with:
        node-version: lts/*
    - name: Install dependencies
      run: npm ci
    - name: Install Playwright Browsers
      run: npx playwright install --with-deps
    - name: Run Playwright tests
      env:
        run-testcases: ${{ inputs.run-testcases || 'npm run run-testcases'}}
        workers: ${{inputs.workers || '1'}}
        browsers: ${{inputs.browsers || 'chromium'}}
      run: 
        ${{env.run-testcases}} --worker=${{env.workers}} --browser=${{env.browsers}}
        

    - name: Run Snyk to check for vulnerabilities
      uses: snyk/actions/node@master
      env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
    - name: ZAP Scan
      uses: zaproxy/action-full-scan@v0.13.0
      with:
        target: 'https://the-internet.herokuapp.com/upload?utm_source=chatgpt.com'
    - uses: actions/upload-artifact@v4
      if: ${{ !cancelled() }}
      with:
        name: playwright-report
        path: playwright-report/
        retention-days: 30
